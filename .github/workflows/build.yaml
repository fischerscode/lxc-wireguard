name: Build WireGuard LXC template

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.sha }}
      - name: Install builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg zstd python3 shellcheck
      - name: Check build scripts
        run: |
          bash -n scripts/build.sh scripts/customize.sh
          shellcheck -x scripts/build.sh scripts/customize.sh
          python3 -m unittest discover -s tests -v
      - name: Build and inspect template
        env:
          VERSION: ${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}
        run: sudo scripts/build.sh "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wireguard-lxc
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wireguard-lxc
          path: dist
      - name: Verify and attach assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gh release upload "$RELEASE_TAG" -- ./*.tar.zst ./*.packages.tsv ./*.build-info.txt ./SHA256SUMS
